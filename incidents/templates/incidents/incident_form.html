{% extends 'base.html' %}
{% block content %}
<h2>{% if object %}Edit Incident{% else %}New Incident{% endif %}</h2>
<form method="post">
    {% csrf_token %}
    {% for field in form %}
    <div class="mb-3">
        <label class="form-label">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}<div class="text-danger">{{ field.errors }}</div>{% endif %}
    </div>
    {% endfor %}
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{% url 'incident-list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
